<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gửi Tuệ Liên ❤️</title>
    <style>
        body { 
            background: #ffc0cb; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Arial', sans-serif; 
            overflow: hidden;
        }

        /* Hiệu ứng cho chữ Yêu Tuệ Liên */
        .love-text {
            font-size: 4rem;
            font-weight: bold;
            color: #ff4d6d;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
            z-index: 10;
            cursor: pointer;
            /* Hiệu ứng chuyển động nhịp đập */
            animation: heartbeat 1.5s infinite;
            user-select: none;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .box {
            background: white; 
            padding: 40px; 
            border-radius: 30px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
        }

        button {
            margin-top: 20px;
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.1); }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
